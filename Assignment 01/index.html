<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Set - HTML CSS Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🎲 Dice Collection</h1>
  <p class="subtitle">HTML &amp; CSS Assignment — Dice Faces 1 to 6</p>

  <div class="dice-grid">

    <!-- Dice 1 -->
    <div class="dice">
      <div class="face face-1">
        <span class="dot"></span>
      </div>
    </div>

    <!-- Dice 2 -->
    <div class="dice">
      <div class="face face-2">
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Dice 3 -->
    <div class="dice">
      <div class="face face-3">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>

    <!-- Dice 4 -->
    <div class="dice">
      <div class="face face-4">
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Dice 5 -->
    <div class="dice">
      <div class="face face-5">
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="column">
          <span class="dot"></span>
        </div>
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Dice 6 -->
    <div class="dice">
      <div class="face face-6">
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <div class="column">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
